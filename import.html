
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import timetable</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
            color: #222;
        }

        .container {
            max-width: 450px;
            margin: 40px auto;
            padding: 24px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 10px #0002;
        }

        h2 {
            margin-top: 0;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            background: #2878d0;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d65b5;
        }

        #status {
            margin-top: 18px;
            white-space: pre-wrap;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Import timetable</h2>
        <p>Please select a json file to import.<br>After importing, please reload your open web untis pages.</p>

        <button id="chooseFile">Choose file</button>
        <input id="fileInput" type="file" accept=".json,application/json">

        <div id="status"></div>
    </div>

    <script src="import.js"></script>
</body>
</html>
